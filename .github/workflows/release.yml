name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build aarch64
        run: cargo build --release --package logium-server --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --package logium-server --target x86_64-apple-darwin

      - name: Create universal binary and package
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/logium-server \
            target/x86_64-apple-darwin/release/logium-server \
            -output logium-server
          zip logium-macos-universal.zip logium-server

      - uses: actions/upload-artifact@v4
        with:
          name: logium-macos-universal
          path: logium-macos-universal.zip

  build-linux:
    name: Build Linux x86_64 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --package logium-server --target x86_64-unknown-linux-musl --features bundled-sqlite

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/logium-server .
          tar -czf logium-linux-x86_64.tar.gz logium-server

      - uses: actions/upload-artifact@v4
        with:
          name: logium-linux-x86_64
          path: logium-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --package logium-server

      - name: Package
        run: |
          copy target\release\logium-server.exe logium-server.exe
          Compress-Archive -Path logium-server.exe -DestinationPath logium-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: logium-windows-x86_64
          path: logium-windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: logium-macos-universal
      - uses: actions/download-artifact@v4
        with:
          name: logium-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: logium-windows-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            logium-macos-universal.zip
            logium-linux-x86_64.tar.gz
            logium-windows-x86_64.zip
